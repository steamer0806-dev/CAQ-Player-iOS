<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest">
<title>CAQ Player</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2940;--line:#34445f;--blue:#4f8cff;--green:#20c879;--red:#ff5964}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:720px;margin:auto;padding:24px 16px 50px}header{display:flex;gap:12px;align-items:center;margin:12px 0 24px}.logo{background:var(--blue);padding:12px;border-radius:14px;font-weight:900}
h1{font-size:22px;margin:0}p{color:#b7c4d8;line-height:1.5}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}
button,.pick{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary,.pick{background:var(--blue);color:white}.secondary{background:#34445f;color:white}.quiet{background:transparent;color:#c7d2e3;border:1px solid var(--line)}
#file{display:none}.pick{display:block;text-align:center;margin:18px 0}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;color:#bdcbe0;font-size:13px}.q{font-size:22px;line-height:1.4;margin:22px 0}
.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;background:#263752;color:white;border:2px solid transparent;line-height:1.4}
.answer.correct{background:#123d32;border-color:var(--green)}.answer.wrong{background:#4a202a;border-color:var(--red)}
.answer:disabled{opacity:1}.feedback{min-height:28px;font-weight:700;margin:12px 0}.good{color:var(--green)}.bad{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.row button{flex:1}.progress{height:7px;background:#34445f;border-radius:8px;margin-top:14px}.bar{height:7px;background:var(--blue);border-radius:8px;width:0}
.small{font-size:13px;color:#aebdd2}.score{font-size:48px;font-weight:900;text-align:center}.review{padding:12px 0;border-top:1px solid var(--line)}
</style></head><body><main>
<header><div class="logo">CAQ</div><div><h1>CAQ Quiz Player</h1><div class="small">Offline quiz practice · Safari</div></div></header>
<section id="home" class="panel"><h2>Open your quiz</h2><p>Choose a CAQ <b>.quiz</b> file from the iPhone Files app. The quiz is read locally on this device.</p>
<label class="pick" for="file">Choose .quiz file</label><input id="file" type="file" accept=".quiz,application/zip,*/*">
<div id="loaded" class="hidden"><p id="info"></p><button id="start" class="primary" style="width:100%">Start shuffled quiz</button></div>
<p class="small">Supports CAQ ZIP archives containing tempQuz.quz and multipleChoiceV2 questions.</p><div id="status" class="small"></div></section>
<section id="play" class="panel hidden"><div class="top"><span id="counter"></span><span id="scorelive"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div>
<div class="row"><button id="speak" class="secondary">🔊 Read question</button><button id="next" class="primary">Next</button></div>
<div class="row"><button id="quit" class="quiet">Exit quiz</button></div></section>
<section id="result" class="panel hidden"><h2>Quiz complete</h2><div class="score" id="score"></div><p id="summary"></p><div id="review"></div><button id="again" class="primary" style="width:100%">Shuffle and try again</button><button id="back" class="quiet" style="width:100%;margin-top:8px">Choose another file</button></section>
</main>
<script>
const $=id=>document.getElementById(id);let bank=[],order=[],at=0,correctCount=0,chosen=null,fileName="";
function show(id){["home","play","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function entry(buf,wanted){
 const v=new DataView(buf),b=new Uint8Array(buf);let e=-1;
 for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw Error("This file is not a supported ZIP-based CAQ quiz.");
 let p=v.getUint32(e+16,true),n=v.getUint16(e+10,true);
 for(let i=0;i<n;i++){if(v.getUint32(p,true)!==0x02014b50)throw Error("Damaged ZIP directory.");
 let m=v.getUint16(p+10,true),sz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
 let name=new TextDecoder().decode(b.slice(p+46,p+46+nl));
 if(name===wanted){let start=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),data=b.slice(start,start+sz);
 if(m===0)return data;if(m===8&&"DecompressionStream"in window){let ds=new DecompressionStream("deflate-raw");return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())}
 throw Error("This Safari version cannot decompress this quiz archive. Update iOS/Safari and try again.");}
 p+=46+nl+el+cl}throw Error("Could not find tempQuz.quz inside this .quiz file.");
}
function parse(s){let qs=[];for(let raw of s.replace(/^\uFEFF/,"").split(">><<")){let a=raw.split("<>");if((a[0]||"").trim()!=="multipleChoiceV2")continue;let opts=[];for(let z of a.slice(3)){z=z.trim();if((z[0]==="C"||z[0]==="W")&&z.slice(1).trim())opts.push({t:z.slice(1).trim(),ok:z[0]==="C"})}if((a[1]||"").trim()&&opts.length>1)qs.push({q:a[1].trim(),opts})}if(!qs.length)throw Error("No multipleChoiceV2 questions found.");return qs}
$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;$("status").textContent="Reading "+f.name+"…";try{bank=parse(new TextDecoder().decode(await entry(await f.arrayBuffer(),"tempQuz.quz")));fileName=f.name;$("info").textContent=`${f.name} · ${bank.length} questions loaded`;$("loaded").classList.remove("hidden");$("status").textContent="Imported locally. Your quiz file is not uploaded."; }catch(err){$("status").textContent=err.message}e.target.value=""};
function start(){order=shuffle(bank.map((q,i)=>i));at=0;correctCount=0;show("play");render()}
function render(){let q=bank[order[at]];chosen=null;$("counter").textContent=`Question ${at+1} of ${order.length}`;$("scorelive").textContent=`${correctCount} correct`;$("bar").style.width=(at/order.length*100)+"%";$("question").textContent=q.q;$("feedback").textContent="";$("answers").innerHTML="";
shuffle(q.opts.map((o,i)=>({...o,orig:i}))).forEach((o,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+i)+". "+o.t;b.onclick=()=>pick(o,b);$("answers").append(b)});$("next").textContent=at===order.length-1?"See results":"Next"}
function pick(o,btn){if(chosen!==null)return;chosen=o.orig;let q=bank[order[at]],all=[...$("answers").children];all.forEach(b=>{b.disabled=true;let text=b.textContent.slice(3);let opt=q.opts.find(x=>x.t===text);if(opt?.ok)b.classList.add("correct");else if(b===btn)b.classList.add("wrong")});
if(o.ok){correctCount++;$("feedback").textContent="Correct!";$("feedback").className="feedback good"}else{let c=q.opts.find(x=>x.ok);$("feedback").textContent="Not quite. Correct answer: "+c.t;$("feedback").className="feedback bad"}$("scorelive").textContent=`${correctCount} correct`}
function speak(){let q=bank[order[at]];let text=q.q+". "+q.opts.map((o,i)=>"Option "+String.fromCharCode(65+i)+": "+o.t).join(". ");if(!("speechSynthesis"in window)){ $("feedback").textContent="Speech is not available in this browser.";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.88;u.pitch=1;speechSynthesis.speak(u)}
$("start").onclick=start;$("speak").onclick=speak;$("next").onclick=()=>{if(chosen===null){$("feedback").textContent="Choose an answer first.";return}if(at<order.length-1){at++;render()}else finish()};
function finish(){show("result");$("score").textContent=Math.round(correctCount/order.length*100)+"%";$("summary").textContent=`${correctCount} correct out of ${order.length} questions.`;$("review").innerHTML=""}
$("again").onclick=start;$("back").onclick=()=>{show("home");$("loaded").classList.add("hidden")};$("quit").onclick=()=>{speechSynthesis?.cancel();show("home")};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
